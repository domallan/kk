version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kk_db
      POSTGRES_USER: kk_user
      POSTGRES_PASSWORD: kk_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kk_user -d kk_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

